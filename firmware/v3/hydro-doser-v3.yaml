# Hydro Doser v3 -- an ESP32 with a 0.96" OLED and a KY-040 knob on the
# faceplate, three 12 V peristaltic pumps through a ULN2003. Works without a
# phone: turn to choose, click to open, click to run; turn up past the top
# for Go back. Hold only runs a pump on Manual; on the home screen a 3 s hold
# turns the screen off, and a click turns it back on.
#
#   Hydrohomie  ->   Dose A        ->   Dose A, 25 ml
#   > Dose A         > 5 ml             12 s left
#     Dose B           10 ml            click to cancel
#     Dose C           25 ml
#     Dose ABC         50 ml
#     Settings         Manual          (hold the button: the pump runs while it is held)
#
#   Settings: PIN (set a 4-digit PIN with the knob; 0000 clears it), Autolock
#   (Off, 1 min, 5 min: with a PIN set, the screen locks after that long
#   without a touch and asks for the PIN), Reset (forget the network, the PIN
#   and the settings, and reboot into set-up).
#
# A is Nutrient A (pump 0), B is Nutrient B (pump 2), C is Water (pump 1),
# ABC runs A, then B, then C. A dose's time is ml / flow rate; the flow rates
# are numbers you can set from Home Assistant once the pumps are calibrated.
#
#   esphome run hydro-doser-v3.yaml --device /dev/cu.usbserial-110    # over USB
#   esphome run hydro-doser-v3.yaml --device hydro-doser-v3.local     # over the air after that
#
# Wiring (README.md): OLED SDA GPIO21, SCL GPIO22; knob's 5-pin plug on five
# neighbouring pins, CLK GPIO19, DT GPIO18, SW GPIO5, + GPIO17, GND GPIO16; ULN2003 IN1..IN3 GPIO25/26/27; Gravity TDS board's
# 3-pin plug on GPIO35 (A), GPIO32 (+), GPIO33 (-), side by side on the header;
# pH board Po through a 10k/20k divider to GPIO34, V+ on 5 V (VIN); float
# switch GPIO14 to GND. The probes and the float come in through the GX12.

esphome:
  name: hydro-doser-v3
  friendly_name: Hydrohomie
  on_boot:
    - lambda: 'id(status).publish_state("idle");'
    - output.turn_off: knob_gnd  # the knob's ground ...
    - output.turn_on: knob_vcc   # ... and its 3.3 V
    - output.turn_off: tds_gnd   # the TDS board's ground ...
    - output.turn_on: tds_vcc    # ... and its 3.3 V, from two GPIOs beside its signal pin
  includes:
    - pumps.h       # pump_on / pumps_on, by the menu's numbering

esp32:
  board: esp32dev

logger:

# No credentials baked in. Out of the box the device offers two ways to
# join a network, both local: the Home Assistant app finds it over
# Bluetooth (Improv) and asks for the Wi-Fi details, or it raises an open
# "Hydrohomie" access point with a captive portal to type them into. Once
# on the network, Home Assistant discovers it and adds it with one click.
wifi:
  id: wifi_id
  ap:
    ssid: "Hydrohomie"
    ap_timeout: 1min          # the set-up modes come up a minute after a known network is not found
  on_connect:
    - component.update: oled
  on_disconnect:
    - component.update: oled

captive_portal:

improv_serial:

esp32_ble_server:

esp32_improv:
  authorizer: none
  on_provisioned:
    - component.update: oled

api:
  actions:
    - action: dose
      variables: { pump: string, ml: float }
      then:
        - lambda: "id(from_ha) = true;"
        - script.execute:
            id: dose
            which: !lambda 'return pump == "A" || pump == "a" ? 0 : pump == "B" || pump == "b" ? 1 : pump == "C" || pump == "c" ? 2 : 3;'
            ml: !lambda return ml;
    - action: cancel
      then:
        - script.execute: stop_all

ota:
  - platform: esphome

# ------------------------------------------------------------- the pumps
# Menu order A, B, C maps to the ULN2003's IN1 (Nutrient A), IN3 (Nutrient
# B), IN2 (Water): see the wiring table.
output:
  - platform: gpio
    id: out_a
    pin: GPIO25
  - platform: gpio
    id: out_b
    pin: GPIO27
  - platform: gpio
    id: out_c
    pin: GPIO26
  # The Gravity TDS board powered from the two pins beside its signal, so
  # its 3-pin plug goes on the header in one piece: it draws a few mA.
  # The knob powered from the two pins beside its signals, so its 5-pin plug
  # goes on the header in one piece: it draws about 1 mA through its pull-ups.
  - platform: gpio
    id: knob_vcc
    pin: GPIO17
  - platform: gpio
    id: knob_gnd
    pin: GPIO16
  - platform: gpio
    id: tds_vcc
    pin: GPIO32
  - platform: gpio
    id: tds_gnd
    pin: GPIO33

switch:
  - platform: template
    id: sw_a
    name: "Pump A"
    icon: mdi:pump
    optimistic: true
    turn_on_action: { script.execute: { id: manual_on, which: 0 } }
    turn_off_action: { script.execute: stop_all }
  - platform: template
    id: sw_b
    name: "Pump B"
    icon: mdi:pump
    optimistic: true
    turn_on_action: { script.execute: { id: manual_on, which: 1 } }
    turn_off_action: { script.execute: stop_all }
  - platform: template
    id: sw_c
    name: "Pump C"
    icon: mdi:pump
    optimistic: true
    turn_on_action: { script.execute: { id: manual_on, which: 2 } }
    turn_off_action: { script.execute: stop_all }

text_sensor:
  - platform: template
    id: status
    name: "Status"
    icon: mdi:water-pump
  - platform: wifi_info
    ip_address: { name: "IP address" }
  # Nutrient level against the reading marked Nominal (a reservoir dosed to
  # spec): Low or High once it leaves the band, with a little hysteresis so
  # it does not flicker at the edge. "No reading" when the probe reads 0
  # (dry or unplugged), so an auto-doser never doses on a dead probe.
  - platform: template
    id: nutrient_level
    name: "Nutrient level"
    icon: mdi:beaker-check-outline
    update_interval: 10s
    lambda: |-
      float t = id(tds).state;
      if (isnan(t) || t <= 0) return {"No reading"};
      float n = id(tds_nominal).state, b = id(tds_band).state / 100.0f, h = 0.02f;
      std::string last = id(nutrient_level).state;
      float lo = n * (1 - b), hi = n * (1 + b);
      if (last == "Low")  lo += n * h;    // stay Low until it is clearly back
      if (last == "High") hi -= n * h;    // stay High likewise
      if (t < lo) return {"Low"};
      if (t > hi) return {"High"};
      return {"Nominal"};

number:
  - platform: template
    id: rate_a
    name: "Flow rate A"
    unit_of_measurement: "mL/min"
    min_value: 10
    max_value: 300
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: rate_b
    name: "Flow rate B"
    unit_of_measurement: "mL/min"
    min_value: 10
    max_value: 300
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: rate_c
    name: "Flow rate C"
    unit_of_measurement: "mL/min"
    min_value: 10
    max_value: 300
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    entity_category: config
  # TDS: the reading is compensated to 25 °C, so it needs the water's
  # temperature (no probe for it yet: set it here), and a factor to
  # calibrate against a known solution.
  - platform: template
    id: water_temp
    name: "Water temperature"
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 40
    step: 0.5
    initial_value: 22
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: tds_nominal
    name: "TDS nominal"
    unit_of_measurement: "ppm"
    icon: mdi:target
    min_value: 0
    max_value: 3000
    step: 1
    initial_value: 592            # the Rise reservoir dosed to spec, 2026-09-26
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: tds_band
    name: "TDS band"
    unit_of_measurement: "%"
    icon: mdi:plus-minus-variant
    min_value: 2
    max_value: 50
    step: 1
    initial_value: 10             # Low below nominal - 10 %, High above + 10 %
    restore_value: true
    optimistic: true
    entity_category: config
  # pH calibration: the board's voltage in pH 7 buffer, and how much it
  # falls per pH step (set from a pH 4 buffer with the buttons below).
  - platform: template
    id: ph7_v
    name: "pH 7 voltage"
    unit_of_measurement: "V"
    min_value: 1
    max_value: 4
    step: 0.001
    initial_value: 2.5
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: ph_slope
    name: "pH slope"
    unit_of_measurement: "V/pH"
    min_value: 0.05
    max_value: 0.5
    step: 0.001
    initial_value: 0.18
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    id: tds_k
    name: "TDS calibration"
    min_value: 0.5
    max_value: 2
    step: 0.01
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: config

# ------------------------------------------------------------- the screen
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

font:
  - file: "/System/Library/Fonts/Supplemental/Verdana.ttf"
    id: f_row
    size: 9
  - file: "/System/Library/Fonts/Supplemental/Verdana.ttf"
    id: f_title
    size: 9
  - file: "/System/Library/Fonts/Supplemental/Verdana.ttf"
    id: f_big
    size: 16

# page 0: the dose list. page 1: a dose's quantities. page 2: dosing a
# quantity (a timer). page 3: manual, running while the button is held.
globals:
  - id: page
    type: int
    initial_value: "0"
  - id: sel0
    type: int
    initial_value: "0"          # highlight on page 0: 0 A, 1 B, 2 C, 3 ABC
  - id: sel1
    type: int
    initial_value: "0"          # highlight on page 1: -1 the back arrow in the breadcrumb, 0..3 the quantities, 4 Manual
  - id: dose_ml
    type: float
    initial_value: "0"
  - id: dose_end
    type: uint32_t
    initial_value: "0"          # millis() when the running step ends
  - id: dose_step
    type: int
    initial_value: "0"          # which pump is running now, for ABC
  - id: from_ha
    type: bool
    initial_value: "false"      # the run came from Home Assistant: cancelling goes to the home page
  # pages 4..9: settings, autolock, PIN entry, a message, reset confirm, locked
  - id: sel4
    type: int
    initial_value: "0"          # settings: -1 back, 0 PIN, 1 Autolock, 2 Reset
  - id: sel5
    type: int
    initial_value: "0"          # autolock: -1 back, 0 Off, 1 1 min, 2 5 min
  - id: pin
    type: int
    initial_value: "0"          # 0 means no PIN; otherwise 1..9999, shown as four digits
    restore_value: true
  - id: autolock_min
    type: int
    initial_value: "0"          # 0 off, else minutes
    restore_value: true
  - id: digits
    type: int[4]
    initial_value: "{0, 0, 0, 0}"
  - id: pin_pos
    type: int
    initial_value: "0"
  - id: pin_mode
    type: int
    initial_value: "0"          # 0 set a new PIN, 1 unlock
  - id: asleep                  # the screen is off (a 3 s hold on the home screen); a click wakes it
    type: bool
    initial_value: 'false'
  - id: ha_woke                 # a Home Assistant run woke the screen: it goes back off when the run ends, unless the knob was used
    type: bool
    initial_value: 'false'
  - id: swallow                 # the click that woke the screen does nothing else
    type: bool
    initial_value: 'false'
  - id: pin_back                # PIN entry: Go back highlighted
    type: bool
    initial_value: 'false'
  - id: sel8                    # reset confirmation: 0 the reset button, -1 Go back
    type: int
    initial_value: '0'
  - id: last_input
    type: uint32_t
    initial_value: "0"
  - id: msg_until
    type: uint32_t
    initial_value: "0"
  - id: page_after_msg
    type: int
    initial_value: "4"

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 250ms
    lambda: |-
      // A two-colour OLED: the top 16 rows are yellow, the rest blue.
      static const char *DOSES[4] = {"A", "B", "C", "ABC"};
      static const char *QTYS[5] = {"5 ml", "10 ml", "25 ml", "50 ml", "Manual"};
      static const char *LOCKS[3] = {"Off", "1 min", "5 min"};
      int p = id(page);
      // the yellow band: the active menu's title; a highlighted "< Go back"
      // when the back arrow is selected
      char title[32];
      int sel_band = (p == 1 && id(sel1) < 0) || (p == 4 && id(sel4) < 0) || (p == 5 && id(sel5) < 0) || (p == 6 && id(pin_back)) || (p == 8 && id(sel8) < 0);
      if (p == 0) snprintf(title, sizeof title, "Hydrohomie");
      else if (p == 1) snprintf(title, sizeof title, "Dose %s", DOSES[id(sel0)]);
      else if (p == 2) snprintf(title, sizeof title, "Dose %s, %.0f ml", DOSES[id(sel0)], id(dose_ml));
      else if (p == 3) snprintf(title, sizeof title, "Dose %s, manual", DOSES[id(sel0)]);
      else if (p == 4) snprintf(title, sizeof title, "Settings");
      else if (p == 5) snprintf(title, sizeof title, "Autolock");
      else if (p == 6) snprintf(title, sizeof title, id(pin_mode) == 0 ? "New PIN" : "Enter PIN");
      else if (p == 7) snprintf(title, sizeof title, "Settings");
      else if (p == 8) snprintf(title, sizeof title, "Reset");
      else snprintf(title, sizeof title, "Locked");
      if (sel_band) { it.filled_rectangle(0, 0, 128, 16); it.printf(2, 8, id(f_title), COLOR_OFF, TextAlign::CENTER_LEFT, "<  Go back"); }
      else {
        it.printf(2, 8, id(f_title), TextAlign::CENTER_LEFT, "%s", title);
        // on the home screen: the nutrient level at the right
        if (p == 0) {
          const std::string &lvl = id(nutrient_level).state;
          if (!lvl.empty()) it.printf(126, 8, id(f_title), TextAlign::CENTER_RIGHT, "%s", lvl == "No reading" ? "No probe" : lvl.c_str());
        }
      }
      // the list below it: four rows of 11, scrolling if there are more; at
      // the right of each row a glyph: a chevron for a submenu, a play
      // triangle for something that runs
      auto list = [&](const char **items, int n, int sel, bool play) {
        int first = sel > 3 ? sel - 3 : 0;
        for (int i = first; i < n && i < first + 4; i++) {
          int y = 18 + (i - first)*11;
          auto col = i == sel ? COLOR_OFF : COLOR_ON;
          if (i == sel) it.filled_rectangle(0, y - 2, 128, 12);
          it.printf(4, y + 4, id(f_row), col, TextAlign::CENTER_LEFT, "%s", items[i]);
          if (play) it.filled_triangle(118, y + 1, 118, y + 8, 124, y + 4, col);
          else { it.line(118, y + 1, 121, y + 4, col); it.line(121, y + 4, 118, y + 7, col); it.line(119, y + 1, 122, y + 4, col); it.line(122, y + 4, 119, y + 7, col); }
        }
      };
      auto button = [&](const char *text) { it.filled_rectangle(0, 49, 128, 13); it.printf(64, 55, id(f_row), COLOR_OFF, TextAlign::CENTER, "%s", text); };
      if (p == 0) {
        static const char *ITEMS[5] = {"Dose A", "Dose B", "Dose C", "Dose ABC", "Settings"};
        list(ITEMS, 5, id(sel0), false);
      } else if (p == 1) {
        list(QTYS, 5, id(sel1), true);
      } else if (p == 2) {
        uint32_t now = millis();
        int left = id(dose_end) > now ? (id(dose_end) - now + 999) / 1000 : 0;
        if (id(sel0) == 3) it.printf(64, 22, id(f_big), TextAlign::TOP_CENTER, "%s: %d s", DOSES[id(dose_step)], left);
        else it.printf(64, 22, id(f_big), TextAlign::TOP_CENTER, "%d s left", left);
        button("click to cancel");
      } else if (p == 3) {
        it.printf(64, 22, id(f_big), TextAlign::TOP_CENTER, "running");
        if (id(from_ha)) button("click to stop"); else it.printf(64, 50, id(f_row), TextAlign::TOP_CENTER, "release to stop");
      } else if (p == 4) {
        char lock[24]; snprintf(lock, sizeof lock, "Autolock:    %s", LOCKS[id(autolock_min) == 0 ? 0 : id(autolock_min) == 1 ? 1 : 2]);
        const char *ITEMS[3] = {id(pin) ? "PIN (set)" : "PIN", lock, "Reset"};
        list(ITEMS, 3, id(sel4), false);
      } else if (p == 5) {
        char rows[3][12]; const char *ITEMS[3];
        for (int i = 0; i < 3; i++) { int m = i == 0 ? 0 : i == 1 ? 1 : 5; snprintf(rows[i], sizeof rows[i], "%s%s", LOCKS[i], id(autolock_min) == m ? "  *" : ""); ITEMS[i] = rows[i]; }
        list(ITEMS, 3, id(sel5), true);
      } else if (p == 6) {
        // four digits; the one being set is highlighted; turn to change it, click to move on
        for (int i = 0; i < 4; i++) {
          int x = 26 + i*20;
          if (i == id(pin_pos) && !id(pin_back)) { it.filled_rectangle(x - 8, 22, 16, 22); it.printf(x, 33, id(f_big), COLOR_OFF, TextAlign::CENTER, "%d", id(digits)[i]); }
          else if (i < id(pin_pos)) it.printf(x, 33, id(f_big), TextAlign::CENTER, "*");
          else it.printf(x, 33, id(f_big), TextAlign::CENTER, "_");
        }
        if (id(pin_mode) == 0) it.printf(64, 55, id(f_row), TextAlign::CENTER, "0000 clears the PIN");
      } else if (p == 7) {
        it.printf(64, 30, id(f_big), TextAlign::CENTER, "Set a PIN first");
      } else if (p == 8) {
        it.printf(64, 24, id(f_row), TextAlign::CENTER, "Forget the network, the PIN");
        it.printf(64, 36, id(f_row), TextAlign::CENTER, "and the settings?");
        if (id(sel8) == 0) button("click to reset"); else it.printf(64, 55, id(f_row), TextAlign::CENTER, "click to reset");
      } else {
        it.printf(64, 30, id(f_big), TextAlign::CENTER, "Locked");
        button("click to unlock");
      }

# --------------------------------------------------------------- the knob
sensor:
  # The pH board's Po, through a 10k over 20k divider (its output reaches
  # about 5 V at the acid end; the ESP32's input takes 3.3). x1.5 undoes the
  # divider: this is the board's own output voltage.
  - platform: adc
    id: ph_volts
    name: "pH voltage"
    pin: GPIO34
    attenuation: 12db
    samples: 16
    update_interval: never       # read by the measure script, with the TDS board off
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - multiply: 1.5
      - median:
          window_size: 5
          send_every: 5
  # pH from the voltage, two-point calibrated: V at pH 7, and volts per pH
  # (the board's output falls as pH rises).
  - platform: template
    id: ph
    name: "pH"
    icon: mdi:ph
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      float v = id(ph_volts).state;
      // the ADC's floor (0.142 V, x1.5 = 0.21) is nothing on the input; a real
      // pH board sits around 1.5 to 3.5 V
      if (isnan(v) || v < 0.3f) return NAN;
      return 7.0f + (id(ph7_v).state - v) / id(ph_slope).state;
  # The Gravity TDS board's output, 0 to 2.3 V.
  - platform: adc
    id: tds_volts
    name: "TDS voltage"
    pin: GPIO35
    attenuation: 12db
    samples: 16
    update_interval: never       # read by the measure script
    accuracy_decimals: 3
    entity_category: diagnostic
    filters:
      - median:
          window_size: 5
          send_every: 5
  # DFRobot's formula: the voltage compensated to 25 °C, then its cubic
  # fit, halved for ppm, times the calibration factor.
  - platform: template
    id: tds
    name: "TDS"
    unit_of_measurement: "ppm"
    icon: mdi:water-opacity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float v = id(tds_volts).state;
      if (isnan(v)) return NAN;
      // The ESP32's ADC can't see below about 0.14 V: a dry probe reads
      // 0.142. Anything under 0.16 is that floor, so 0 ppm (it hides
      // readings under about 70 ppm, far below a nutrient reservoir).
      if (v < 0.16f) return 0.0f;
      float c = v / (1.0f + 0.02f * (id(water_temp).state - 25.0f));
      float ppm = (133.42f * c * c * c - 255.86f * c * c + 857.39f * c) * 0.5f * id(tds_k).state;
      return ppm < 0 ? 0 : ppm;
  # What the screen shows, for Home Assistant: the countdown of a running
  # dose, from the knob or from HA alike; 0 when nothing runs.
  - platform: template
    id: seconds_left
    name: "Seconds left"
    unit_of_measurement: "s"
    icon: mdi:timer-outline
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(page) != 2) return 0;
      uint32_t now = millis();
      return id(dose_end) > now ? (id(dose_end) - now + 999) / 1000 : 0;
    filters:
      - delta: 0.5

  - platform: rotary_encoder
    id: knob
    pin_a:
      number: GPIO18            # DT
      mode: { input: true, pullup: true }
    pin_b:
      number: GPIO19            # CLK
      mode: { input: true, pullup: true }
    resolution: 1               # one step per detent on the KY-040; DT as A so clockwise moves down the list
    on_clockwise:
      then:
        - lambda: |-
            if (id(asleep)) return;                                  // the screen is off: the knob does nothing
            id(ha_woke) = false;
            id(last_input) = millis();
            int p = id(page);
            if (p == 0 && id(sel0) < 4) id(sel0)++;
            if (p == 1 && id(sel1) < 4) id(sel1)++;
            if (p == 4 && id(sel4) < 2) id(sel4)++;
            if (p == 5 && id(sel5) < 2) id(sel5)++;
            if (p == 6) { if (id(pin_back)) id(pin_back) = false; else id(digits)[id(pin_pos)] = (id(digits)[id(pin_pos)] + 1) % 10; }
            if (p == 8 && id(sel8) < 0) id(sel8) = 0;
        - component.update: oled
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(asleep)) return;
            id(ha_woke) = false;
            id(last_input) = millis();
            int p = id(page);
            if (p == 0 && id(sel0) > 0) id(sel0)--;
            if (p == 1 && id(sel1) > -1) id(sel1)--;
            if (p == 4 && id(sel4) > -1) id(sel4)--;
            if (p == 5 && id(sel5) > -1) id(sel5)--;
            if (p == 6) { if (id(pin_pos) == 0 && id(digits)[0] == 0) id(pin_back) = true;   // back past 0 on the first digit: Go back
                          else id(digits)[id(pin_pos)] = (id(digits)[id(pin_pos)] + 9) % 10; }
            if (p == 8 && id(sel8) == 0) id(sel8) = -1;
        - component.update: oled

binary_sensor:
  # The reservoir's float switch, through the GX12: mounted so its contact is
  # CLOSED while the water is up at the float. Closed pulls GPIO14 low. Open
  # reads Low water: so an unplugged or broken float blocks dosing too.
  - platform: gpio
    id: water_low
    name: "Reservoir low"
    device_class: problem
    pin:
      number: GPIO14
      mode: { input: true, pullup: true }
    filters:
      - delayed_on_off: 2s
  - platform: template
    id: running
    name: "Running"
    icon: mdi:water-pump
    lambda: "return id(page) == 2 || id(page) == 3;"

  - platform: gpio
    id: knob_button
    pin:
      number: GPIO5             # a strapping pin, but only its default (high) matters, and the button is up at boot
      mode: { input: true, pullup: true }
      ignore_strapping_warning: true
      inverted: true
    filters:
      - delayed_on_off: 30ms
    # Manual: the pump runs from press to release
    on_press:
      then:
        - lambda: |-
            id(last_input) = millis();
            id(ha_woke) = false;                                     // the knob is in use: the screen stays on
            if (id(asleep)) { id(asleep) = false; id(swallow) = true; id(oled).turn_on(); }   // a press wakes the screen, nothing else
            else id(swallow) = false;
        - if:
            condition: { lambda: "return id(page) == 1 && id(sel1) == 4 && !id(swallow);" }
            then:
              - lambda: |-
                  id(from_ha) = false;
                  id(page) = 3;
                  pumps_on(id(sel0), true);
                  id(status).publish_state(std::string("manual ") + (id(sel0) == 3 ? "ABC" : id(sel0) == 0 ? "A" : id(sel0) == 1 ? "B" : "C"));
              - component.update: oled
    on_release:
      then:
        - if:
            condition: { lambda: "return id(page) == 3 && !id(from_ha);" }
            then:
              - lambda: |-
                  pumps_on(id(sel0), false);
                  id(page) = 1;
                  id(status).publish_state("idle");
              - component.update: oled
    on_multi_click:
      # a click
      - timing:
          - ON for at most 500ms
          - OFF for at least 80ms
        then:
          - lambda: |-
              if (id(swallow)) { id(swallow) = false; return; }      // that click woke the screen
              int p = id(page);
              if (p == 6 && id(pin_back)) { id(pin_back) = false; id(page) = id(pin_mode) == 1 ? 9 : 4; id(oled).update(); return; }
              if (p == 8 && id(sel8) < 0) { id(page) = 4; id(oled).update(); return; }
              if (p == 0) {                                          // home: open the item
                if (id(sel0) == 4) { id(page) = 4; id(sel4) = 0; }
                else { id(page) = 1; id(sel1) = 0; }
              } else if (p == 1) {                                   // quantities
                if (id(sel1) < 0) id(page) = 0;
                else if (id(sel1) < 4) { id(from_ha) = false; id(dose)->execute(id(sel0), id(sel1) == 0 ? 5 : id(sel1) == 1 ? 10 : id(sel1) == 2 ? 25 : 50); }
              } else if (p == 2 || (p == 3 && id(from_ha))) {        // running: cancel
                id(stop_all)->execute();
              } else if (p == 4) {                                   // settings
                if (id(sel4) < 0) { id(page) = 0; }
                else if (id(sel4) == 0) { id(pin_mode) = 0; id(pin_pos) = 0; id(pin_back) = false; for (int i = 0; i < 4; i++) id(digits)[i] = 0; id(page) = 6; }
                else if (id(sel4) == 1) { if (id(pin)) { id(page) = 5; id(sel5) = id(autolock_min) == 0 ? 0 : id(autolock_min) == 1 ? 1 : 2; } else { id(page) = 7; id(msg_until) = millis() + 2000; } }
                else { id(page) = 8; id(sel8) = 0; }
              } else if (p == 5) {                                   // autolock
                if (id(sel5) >= 0) id(autolock_min) = id(sel5) == 0 ? 0 : id(sel5) == 1 ? 1 : 5;
                id(page) = 4;
              } else if (p == 6) {                                   // a PIN digit accepted
                if (id(pin_pos) < 3) id(pin_pos)++;
                else {
                  int v = id(digits)[0]*1000 + id(digits)[1]*100 + id(digits)[2]*10 + id(digits)[3];
                  if (id(pin_mode) == 0) { id(pin) = v; if (v == 0) id(autolock_min) = 0; id(page) = 4; }
                  else if (v == id(pin)) { id(page) = 0; }
                  else { id(pin_pos) = 0; for (int i = 0; i < 4; i++) id(digits)[i] = 0; }   // wrong: again
                }
              } else if (p == 8) {                                   // reset confirmed
                id(factory).press();
              } else if (p == 9) {                                   // locked: ask for the PIN
                id(pin_mode) = 1; id(pin_pos) = 0; id(pin_back) = false; for (int i = 0; i < 4; i++) id(digits)[i] = 0; id(page) = 6;
              }
          - component.update: oled
      # a 3 s hold on the home screen turns the screen off; a hold does
      # nothing else anywhere (on Manual it runs the pump, see on_press)
      - timing:
          - ON for at least 3s
        then:
          - lambda: |-
              if (id(page) == 0 && !id(asleep)) { id(asleep) = true; id(oled).turn_off(); }

button:
  - platform: template
    name: "Cancel"
    icon: mdi:stop
    on_press: { script.execute: stop_all }
  # pH calibration: probe in pH 7 buffer, press the first; rinse, into pH 4
  # buffer, press the second. The slope comes from the two readings.
  - platform: template
    name: "Calibrate pH 7"
    icon: mdi:ph
    entity_category: config
    on_press:
      - script.wait: measure
      - script.execute: measure                  # a fresh reading, the TDS board off
      - script.wait: measure
      - lambda: |-
          float v = id(ph_volts).state;
          if (!isnan(v) && v > 0.3f) { auto c = id(ph7_v).make_call(); c.set_value(v); c.perform(); }
  - platform: template
    name: "Calibrate pH 4"
    icon: mdi:ph
    entity_category: config
    on_press:
      - script.wait: measure
      - script.execute: measure
      - script.wait: measure
      - lambda: |-
          float v = id(ph_volts).state;
          float s = (v - id(ph7_v).state) / 3.0f;
          if (!isnan(v) && s > 0.05f && s < 0.5f) { auto c = id(ph_slope).make_call(); c.set_value(s); c.perform(); }
  # After a fresh fill dosed to spec: take the current TDS as Nominal.
  - platform: template
    name: "Mark TDS nominal"
    icon: mdi:target
    entity_category: config
    on_press:
      - lambda: |-
          float t = id(tds).state;
          if (!isnan(t) && t > 0) {
            auto call = id(tds_nominal).make_call();
            call.set_value(roundf(t));
            call.perform();
          }
  - platform: factory_reset
    id: factory
    internal: true               # Settings > Reset: forgets the network, the PIN and the settings, then reboots

interval:
  # The probes share the reservoir: the TDS board's excitation current upsets
  # the pH probe. So every 30 s: read TDS, switch the TDS board off, let its
  # current die away, read pH, switch it back on to settle before the next.
  - interval: 30s
    then:
      - if:
          condition: { lambda: "return !id(measure).is_running();" }
          then: { script.execute: measure }
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now = millis();
          if (id(page) == 7 && now > id(msg_until)) { id(page) = 4; id(oled).update(); }
          bool idle_page = id(page) <= 1 || id(page) == 4 || id(page) == 5 || id(page) == 8;
          if (id(pin) && id(autolock_min) > 0 && idle_page && now - id(last_input) > (uint32_t) id(autolock_min) * 60000UL) { id(page) = 9; id(oled).update(); }

script:
  - id: measure
    mode: single
    then:
      - repeat:
          count: 5
          then: [ { component.update: tds_volts }, { delay: 300ms } ]
      - component.update: tds
      - component.update: nutrient_level
      - output.turn_off: tds_vcc                 # the TDS board off: its probe stops driving current into the water
      - delay: 3s
      - repeat:
          count: 5
          then: [ { component.update: ph_volts }, { delay: 300ms } ]
      - component.update: ph
      - output.turn_on: tds_vcc                  # back on, 25 s to settle before its next reading

  # Home Assistant turned a pump's switch on: run it until the switch goes
  # off, or Cancel, or a click on the knob.
  - id: manual_on
    parameters:
      which: int
    then:
      - script.stop: dose
      - lambda: |-
          if (id(asleep)) { id(asleep) = false; id(ha_woke) = true; id(oled).turn_on(); }
          pump_on(0, false); pump_on(1, false); pump_on(2, false);
          id(from_ha) = true;
          id(sel0) = which;
          id(page) = 3;
          pumps_on(which, true);
          id(status).publish_state(std::string("manual ") + (which == 0 ? "A" : which == 1 ? "B" : "C"));
      - component.update: oled

  # Dose `ml` from pump `which` (0 A, 1 B, 2 C), or from A, B and C in turn (3).
  - id: dose
    mode: restart
    parameters:
      which: int
      ml: float
    then:
      - lambda: |-
          if (id(asleep)) { id(asleep) = false; id(ha_woke) = true; id(oled).turn_on(); }   // a dose from Home Assistant wakes the screen, until it ends
          pump_on(0, false); pump_on(1, false); pump_on(2, false);
          id(sel0) = which;
          id(dose_ml) = ml;
          id(page) = 2;
          char s[32]; snprintf(s, sizeof s, "dosing %s %.0f ml", which == 3 ? "ABC" : which == 0 ? "A" : which == 1 ? "B" : "C", ml);
          id(status).publish_state(s);
      - component.update: oled
      - repeat:
          count: !lambda "return which == 3 ? 3 : 1;"
          then:
            - lambda: |-
                int p = which == 3 ? iteration : which;
                id(dose_step) = p;
                float rate = p == 0 ? id(rate_a).state : p == 1 ? id(rate_b).state : id(rate_c).state;
                uint32_t ms = (uint32_t) (ml / rate * 60000.0f);
                id(dose_end) = millis() + ms;
                ESP_LOGI("dose", "pump %d: %.0f ml at %.0f mL/min = %u ms", p, ml, rate, ms);
                pump_on(p, true);
            - component.update: oled
            - delay: !lambda "return (uint32_t) (id(dose_end) - millis());"
            - lambda: "pump_on(id(dose_step), false);"
      - lambda: |-
          id(page) = 0;
          id(status).publish_state("idle");
          if (id(ha_woke)) { id(ha_woke) = false; id(asleep) = true; id(oled).turn_off(); }   // it was asleep before HA woke it
      - component.update: oled

  # Cancel or stop, from the knob or from Home Assistant: back to the
  # quantities page a knob-started dose came from, or home for one from HA
  - id: stop_all
    then:
      - script.stop: dose
      - lambda: |-
          pump_on(0, false); pump_on(1, false); pump_on(2, false);
          ESP_LOGI("dose", "stopped");
          id(page) = id(from_ha) || id(page) == 3 ? 0 : 1;
          id(status).publish_state("idle");
          if (id(sw_a).state) id(sw_a).publish_state(false);
          if (id(sw_b).state) id(sw_b).publish_state(false);
          if (id(sw_c).state) id(sw_c).publish_state(false);
          if (id(ha_woke)) { id(ha_woke) = false; id(page) = 0; id(asleep) = true; id(oled).turn_off(); }
      - component.update: oled
