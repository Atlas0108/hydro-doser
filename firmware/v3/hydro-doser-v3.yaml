# Hydro Doser v3 -- an ESP32 with a 0.96" OLED and a KY-040 knob on the
# faceplate, three 12 V peristaltic pumps through a ULN2003. This first cut
# is the menu only: turn the knob to pick Dose A, Dose B, Dose C or Dose
# ABC, click to open it, click again to run, hold to go back. Running is a
# placeholder until the pumps are wired: it shows a page and logs.
#
#   esphome run hydro-doser-v3.yaml --device /dev/cu.usbserial-110    # first flash, over USB
#   esphome run hydro-doser-v3.yaml --device hydro-doser-v3.local     # OTA after that
#
# Wiring (README.md has the table): OLED SDA GPIO21, SCL GPIO22; knob CLK
# GPIO18, DT GPIO19, SW GPIO23; pumps IN1..IN3 GPIO25/26/27 (not used yet).

esphome:
  name: hydro-doser-v3
  friendly_name: Hydro Doser v3

esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_main
      password: !secret wifi_password
  ap:
    ssid: "Hydro Doser v3"
    password: !secret ap_password

# ------------------------------------------------------------- the screen
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

font:
  - file: "/System/Library/Fonts/Supplemental/Verdana.ttf"
    id: f_menu
    size: 13
  - file: "/System/Library/Fonts/Supplemental/Verdana.ttf"
    id: f_small
    size: 10
  - file: "/System/Library/Fonts/Supplemental/Verdana.ttf"
    id: f_big
    size: 20

# page: 0 the menu, 1 a dose's page (click runs it, hold goes back),
# 2 dosing (a placeholder timer for now)
globals:
  - id: page
    type: int
    initial_value: "0"
  - id: chosen
    type: int
    initial_value: "0"          # 0 A, 1 B, 2 C, 3 ABC

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 200ms
    lambda: |-
      static const char *NAMES[4] = {"Dose A", "Dose B", "Dose C", "Dose ABC"};
      if (id(page) == 0) {
        display::Rect bounds(0, 0, 128, 64);
        id(main_menu).draw(&it, &bounds);
      } else if (id(page) == 1) {
        it.printf(64, 4, id(f_big), TextAlign::TOP_CENTER, "%s", NAMES[id(chosen)]);
        it.printf(64, 36, id(f_small), TextAlign::TOP_CENTER, "click to run");
        it.printf(64, 50, id(f_small), TextAlign::TOP_CENTER, "hold to go back");
      } else {
        it.printf(64, 4, id(f_big), TextAlign::TOP_CENTER, "%s", NAMES[id(chosen)]);
        it.printf(64, 36, id(f_menu), TextAlign::TOP_CENTER, "dosing...");
        it.printf(64, 52, id(f_small), TextAlign::TOP_CENTER, "hold to stop");
      }

graphical_display_menu:
  id: main_menu
  font: f_menu
  active: true
  mode: rotary
  on_redraw:
    then:
      component.update: oled
  items:
    - type: command
      text: "Dose A"
      on_value:
        then:
          - script.execute: { id: open_page, which: 0 }
    - type: command
      text: "Dose B"
      on_value:
        then:
          - script.execute: { id: open_page, which: 1 }
    - type: command
      text: "Dose C"
      on_value:
        then:
          - script.execute: { id: open_page, which: 2 }
    - type: command
      text: "Dose ABC"
      on_value:
        then:
          - script.execute: { id: open_page, which: 3 }

# --------------------------------------------------------------- the knob
sensor:
  - platform: rotary_encoder
    id: knob
    pin_a:
      number: GPIO18
      mode: { input: true, pullup: true }
    pin_b:
      number: GPIO19
      mode: { input: true, pullup: true }
    resolution: 2
    on_clockwise:
      then:
        - if:
            condition: { lambda: "return id(page) == 0;" }
            then: { display_menu.down: main_menu }
    on_anticlockwise:
      then:
        - if:
            condition: { lambda: "return id(page) == 0;" }
            then: { display_menu.up: main_menu }

binary_sensor:
  - platform: gpio
    id: knob_button
    pin:
      number: GPIO23
      mode: { input: true, pullup: true }
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_multi_click:
      # a click: on the menu it opens the item; on a dose's page it runs it
      - timing:
          - ON for at most 500ms
          - OFF for at least 80ms
        then:
          - if:
              condition: { lambda: "return id(page) == 0;" }
              then: { display_menu.enter: main_menu }
              else:
                - if:
                    condition: { lambda: "return id(page) == 1;" }
                    then: { script.execute: run_dose }
      # a hold: back to the menu (later: stop the pumps)
      - timing:
          - ON for at least 800ms
        then:
          - script.execute: go_back

script:
  - id: open_page
    parameters:
      which: int
    then:
      - lambda: |-
          id(chosen) = which;
          id(page) = 1;
      - component.update: oled

  - id: go_back
    then:
      - script.stop: run_dose
      - lambda: "id(page) = 0;"
      - component.update: oled

  # Placeholder: the pumps come next. For now it holds the dosing page for
  # three seconds and logs what it would have done.
  - id: run_dose
    mode: restart
    then:
      - lambda: |-
          static const char *NAMES[4] = {"A", "B", "C", "ABC"};
          ESP_LOGI("dose", "would dose %s", NAMES[id(chosen)]);
          id(page) = 2;
      - component.update: oled
      - delay: 3s
      - lambda: "id(page) = 0;"
      - component.update: oled
